# APX H0: minimal physical-display validation configuration.
monitor = eDP-2, preferred, auto, 1

input {
    kb_layout = pt
    follow_mouse = 1

    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

general {
    gaps_in = 0
    gaps_out = 0
    border_size = 1
    layout = dwindle
}

decoration {
    rounding = 0

    blur {
        enabled = false
    }

    shadow {
        enabled = false
    }
}

animations {
    enabled = false
}

misc {
    disable_hyprland_logo = true
    force_default_wallpaper = 0
    disable_splash_rendering = true
}

# Manual emergency exit; the Host watchdog remains authoritative.
bind = SUPER SHIFT, E, exit
