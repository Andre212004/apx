# Expected APX Host mkinitcpio GPU policy. These values are applied to
# /etc/mkinitcpio.conf so both the AMD display GPU and NVIDIA CUDA GPU are
# available early, without admitting Nouveau into the normal UKI.
MODULES=(amdgpu nvidia nvidia_modeset nvidia_uvm nvidia_drm)
HOOKS=(base systemd plymouth autodetect microcode modconf keyboard sd-vconsole block sd-encrypt filesystems fsck)
