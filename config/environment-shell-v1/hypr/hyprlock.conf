general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
}

animations {
    enabled = true
    bezier = apxEase, 0.22, 1, 0.36, 1
    animation = fade, 1, 2.5, apxEase
    animation = inputField, 1, 2.5, apxEase
}

background {
    monitor =
    color = rgba(10, 16, 20, 1.0)
    blur_passes = 0
}

label {
    monitor =
    text = APX
    color = rgba(85, 230, 255, 1.0)
    font_size = 42
    font_family = Adwaita Mono
    position = 0, 150
    halign = center
    valign = center
}

label {
    monitor =
    text = SESSÃO PROTEGIDA
    color = rgba(138, 163, 170, 1.0)
    font_size = 13
    font_family = Adwaita Mono
    position = 0, 102
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 360, 58
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.20
    dots_center = true
    outer_color = rgba(36, 104, 121, 1.0)
    inner_color = rgba(22, 32, 39, 0.95)
    font_color = rgba(232, 247, 250, 1.0)
    check_color = rgba(85, 230, 255, 1.0)
    fail_color = rgba(255, 145, 164, 1.0)
    font_family = Adwaita Mono
    placeholder_text = <span foreground="##8aa3aa">PALAVRA-PASSE APX</span>
    fail_text = <span foreground="##ff91a4">NÃO FOI POSSÍVEL AUTENTICAR</span>
    fade_on_empty = false
    rounding = 6
    position = 0, 12
    halign = center
    valign = center
}

label {
    monitor =
    text = ENTER  ·  ENTRAR
    color = rgba(138, 163, 170, 1.0)
    font_size = 10
    font_family = Adwaita Mono
    position = 0, -48
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgba(232, 247, 250, 1.0)
    font_size = 18
    font_family = Adwaita Mono
    position = 0, 56
    halign = center
    valign = bottom
}
