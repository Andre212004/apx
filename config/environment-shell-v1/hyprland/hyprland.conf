# APX Work desktop v1. This file belongs only to the Work Environment.
monitor = , preferred, auto, 1

input {
    kb_layout = pt
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 1
    layout = dwindle
    col.active_border = rgba(26343aff)
    col.inactive_border = rgba(26343aff)
}

decoration {
    rounding = 4
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}

animations {
    enabled = false
}

misc {
    disable_hyprland_logo = true
    force_default_wallpaper = 0
    disable_splash_rendering = true
}

exec-once = /usr/bin/dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE
exec-once = /home/apx/.local/bin/apx-shell-v1

bind = SUPER, Q, exec, /usr/bin/kitty --directory /home/apx
bind = SUPER, Return, exec, /usr/bin/kitty --directory /home/apx
bind = SUPER SHIFT, Return, exec, /usr/bin/kitty --directory /home/apx /usr/bin/fastfetch
bind = SUPER, F, fullscreen
bind = SUPER, P, exec, quickshell -c apx ipc call host openFiles
bind = SUPER, E, exec, quickshell -c apx ipc call host openEnvironments
bind = SUPER, A, exec, quickshell -c apx ipc call host toggleControls
bind = SUPER, D, exec, quickshell -c apx ipc call host toggleCalendar
bind = SUPER, I, exec, quickshell -c apx ipc call host toggleModel
bind = SUPER, B, exec, quickshell -c apx ipc call host toggleBattery
bind = SUPER SHIFT, B, exec, /usr/bin/brave

# Executor-independent emergency exit. The Host supervisor still performs the
# cleanup and restores the HUB.
bind = SUPER, M, exit
bind = SUPER SHIFT, M, exit
