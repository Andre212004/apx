# APX red workload handoff profile v1.
monitor = , preferred, auto, 1

input {
    kb_layout = pt
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    layout = dwindle
    col.active_border = rgba(ff4d5fff)
    col.inactive_border = rgba(742933ff)
}

decoration {
    rounding = 4
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}

animations {
    enabled = false
}

misc {
    disable_hyprland_logo = true
    force_default_wallpaper = 0
    disable_splash_rendering = true
}

exec-once = /home/apx/.config/quickshell/apx/apx-shell-v1.sh
exec-once = /usr/bin/mako

bind = SUPER, Return, exec, /usr/bin/alacritty
bind = SUPER SHIFT, Return, exec, /usr/bin/alacritty -e /usr/bin/fastfetch
bind = SUPER, D, exec, /usr/bin/rofi -show drun
bind = SUPER, A, exit

# Executor-independent emergency return. Exiting only this compositor lets the
# Host supervisor clean it and restore the Hub.
bind = SUPER, M, exit
bind = SUPER SHIFT, M, exit
