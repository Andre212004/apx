<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #202731; font: 14px sans-serif; color: white; }
      main { display: grid; grid-template-columns: 1fr 1fr; width: 2880px; height: 1024px; }
      figure { position: relative; margin: 0; overflow: hidden; border-right: 2px solid #202731; background: #edf2f3; }
      figcaption { position: absolute; z-index: 2; top: 10px; left: 10px; padding: 6px 9px; border-radius: 5px; background: rgb(14 24 36 / 82%); }
      img { width: 100%; height: 100%; display: block; object-fit: contain; }
    </style>
  </head>
  <body>
    <main id="comparison"></main>
    <script>
      const management = new URLSearchParams(location.search).get("view") === "management";
      const images = management
        ? [["Visual target", "reference/management-target.png"], ["Implementation", "screenshots/management-final.png"]]
        : [["Visual target", "reference/taskbar-target.png"], ["Implementation", "screenshots/taskbar-open-final.png"]];
      document.querySelector("#comparison").innerHTML = images.map(([label, src]) => `<figure><figcaption>${label}</figcaption><img src="${src}" alt="${label}"></figure>`).join("");
    </script>
  </body>
</html>
